# Publishes robouse to PyPI when a version tag (vX.Y.Z) is pushed, with PyPI's trusted publishing: GitHub's OIDC token
# for the `pypi` environment, so no password or API token is stored anywhere. PyPI must list this repository, this
# workflow file (release.yml) and that environment as a trusted publisher of the robouse project (CONTRIBUTING.md).
# Run it by hand (workflow_dispatch) to publish main's version again, for example once PyPI's side is set up.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: the tag, the package and the changelog agree on the version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/robouse/__init__.py)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag $GITHUB_REF_NAME does not match the package's version $version"; exit 1
          fi
          pattern="^## $(printf '%s' "$version" | sed 's/\./\\./g') \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$"
          grep -Eq "$pattern" CHANGELOG.md || { echo "CHANGELOG.md has no dated section for $version"; exit 1; }
          echo "publishing robouse $version"
      - run: uv build
      - name: the wheel installs and runs
        run: |
          uv venv /tmp/w && uv pip install --python /tmp/w/bin/python dist/*.whl
          /tmp/w/bin/robouse --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/robouse/
    permissions:
      id-token: write # PyPI's trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true # a re-run after a version is out does nothing
