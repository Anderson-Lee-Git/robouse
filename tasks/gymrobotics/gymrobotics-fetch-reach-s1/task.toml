version = "1.0"

[task]
name = "robouse/gymrobotics-fetch-reach-s1"
description = "Move the gripper to the goal position and hold it there."

[metadata]
source_benchmark = "Gymnasium-Robotics (Farama)"
source_task = "FetchReach-v4"
suite = "gymrobotics"
category = "manipulation"
difficulty = "easy"
tags = ["fetch", "mujoco", "single-arm", "reach"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
id = "gymrobotics-fetch-reach-s1"
backend = "gymrobotics"
env = "FetchReach-v4"
seed = 1
max_steps = 300
camera = "default"
skills = true
success_mode = "final"  # the goal must still hold after `robo done` and a settle period
