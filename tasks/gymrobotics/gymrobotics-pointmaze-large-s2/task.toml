version = "1.0"

[task]
name = "robouse/gymrobotics-pointmaze-large-s2"
description = "Roll the ball through the maze to the goal."

[metadata]
source_benchmark = "Gymnasium-Robotics (Farama)"
source_task = "PointMaze_Large-v3"
suite = "gymrobotics"
category = "navigation"
difficulty = "hard"
tags = ["pointmaze", "mujoco", "navigation", "2d"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
id = "gymrobotics-pointmaze-large-s2"
backend = "gymrobotics"
env = "PointMaze_Large-v3"
seed = 2
max_steps = 1500
camera = "top"
skills = false
success_mode = "first"  # reaching the goal ends the episode (PointMaze/D4RL episodic protocol)
