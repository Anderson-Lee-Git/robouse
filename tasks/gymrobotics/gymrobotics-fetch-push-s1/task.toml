version = "1.0"

[task]
name = "robouse/gymrobotics-fetch-push-s1"
description = "Push the block across the table so it rests on the goal position."

[metadata]
source_benchmark = "Gymnasium-Robotics (Farama)"
source_task = "FetchPush-v4"
suite = "gymrobotics"
category = "manipulation"
difficulty = "medium"
tags = ["fetch", "mujoco", "single-arm", "push"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
id = "gymrobotics-fetch-push-s1"
backend = "gymrobotics"
env = "FetchPush-v4"
seed = 1
max_steps = 300
camera = "default"
skills = true
success_mode = "final"  # the goal must still hold after `robo done` and a settle period
