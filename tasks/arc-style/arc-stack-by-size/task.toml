version = "1.0"

[task]
name = "robouse/arc-stack-by-size"
description = "Rule inference: sizes"

[metadata]
source_benchmark = "ARC-AGI (style), robouse original"
source_task = "stack-by-size"
source_suite = "arc-style"
suite = "arc-style"
category = "rule-inference"
difficulty = "medium"
tags = ["arc", "few-shot", "stack"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
id = "arc-stack-by-size"
backend = "tabletop"
seed = 0
max_steps = 800
camera = "front"
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "arc-stack-by-size"
title = "Rule inference: sizes"
grid = {rows = 3, cols = 4, cell = 0.08, origin = [-0.12, 0.08]}
objects = [{name = "block_1", kind = "box", color = "purple", cell = [1, 2], pos = [0.0, 0.0], size = [0.025, 0.025, 0.025]}, {name = "block_2", kind = "box", color = "orange", cell = [0, 0], pos = [0.0, 0.0], size = [0.015, 0.015, 0.015]}, {name = "block_3", kind = "box", color = "cyan", cell = [2, 1], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}]
fixtures = []
goals = [{type = "stack", order = ["block_1", "block_3", "block_2"]}, {type = "unmoved", obj = "block_1", tol = 0.02}]
max_steps = 800
public = {examples = [{before = [{color = "red", cell = [0, 0], edge_cm = 5}, {color = "blue", cell = [2, 3], edge_cm = 4}, {color = "green", cell = [1, 1], edge_cm = 3}], after = [{color = "red", cell = [0, 0], level = 0}, {color = "blue", cell = [0, 0], level = 1}, {color = "green", cell = [0, 0], level = 2}]}, {before = [{color = "yellow", cell = [2, 2], edge_cm = 5}, {color = "red", cell = [0, 3], edge_cm = 3}, {color = "green", cell = [1, 0], edge_cm = 4}], after = [{color = "yellow", cell = [2, 2], level = 0}, {color = "green", cell = [2, 2], level = 1}, {color = "red", cell = [2, 2], level = 2}]}]}
