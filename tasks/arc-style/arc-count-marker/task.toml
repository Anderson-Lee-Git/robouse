version = "1.0"

[task]
name = "robouse/arc-count-marker"
description = "Rule inference: the marker"

[metadata]
source_benchmark = "ARC-AGI (style), robouse original"
source_task = "count-marker"
source_suite = "arc-style"
suite = "arc-style"
category = "rule-inference"
difficulty = "medium"
tags = ["arc", "few-shot", "counting"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
id = "arc-count-marker"
backend = "tabletop"
seed = 0
max_steps = 500
camera = "front"
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "arc-count-marker"
title = "Rule inference: the marker"
grid = {rows = 3, cols = 4, cell = 0.08, origin = [-0.12, 0.08]}
objects = [{name = "block_1", kind = "box", color = "red", cell = [0, 0], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "block_2", kind = "box", color = "green", cell = [1, 2], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "block_3", kind = "box", color = "blue", cell = [2, 1], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "marker", kind = "box", color = "black", pos = [0.26, 0.08], size = [0.02, 0.02, 0.02]}]
fixtures = [{name = "pad_1", kind = "pad", pos = [-0.18, -0.2], size = [0.035, 0.035], color = "grey", label = "1"}, {name = "pad_2", kind = "pad", pos = [-0.06, -0.2], size = [0.035, 0.035], color = "grey", label = "2"}, {name = "pad_3", kind = "pad", pos = [0.06, -0.2], size = [0.035, 0.035], color = "grey", label = "3"}, {name = "pad_4", kind = "pad", pos = [0.18, -0.2], size = [0.035, 0.035], color = "grey", label = "4"}]
goals = [{type = "on_pad", obj = "marker", pad = "pad_3"}, {type = "grid", objects = ["block_1", "block_2", "block_3"], expected = [{color = "red", cell = [0, 0]}, {color = "green", cell = [1, 2]}, {color = "blue", cell = [2, 1]}]}]
max_steps = 500
public = {examples = [{before = [{color = "red", cell = [0, 1]}, {color = "yellow", cell = [2, 2]}], marker_before = "off the grid", after = [{color = "red", cell = [0, 1]}, {color = "yellow", cell = [2, 2]}], marker_after = "on pad 2"}, {before = [{color = "blue", cell = [0, 0]}, {color = "blue", cell = [0, 3]}, {color = "green", cell = [1, 1]}, {color = "red", cell = [2, 2]}], marker_before = "off the grid", after = [{color = "blue", cell = [0, 0]}, {color = "blue", cell = [0, 3]}, {color = "green", cell = [1, 1]}, {color = "red", cell = [2, 2]}], marker_after = "on pad 4"}, {before = [{color = "orange", cell = [1, 3]}], marker_before = "off the grid", after = [{color = "orange", cell = [1, 3]}], marker_after = "on pad 1"}]}
