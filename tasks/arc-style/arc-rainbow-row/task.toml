version = "1.0"

[task]
name = "robouse/arc-rainbow-row"
description = "Rule inference: ordering"

[metadata]
source_benchmark = "ARC-AGI (style), robouse original"
source_task = "rainbow-row"
source_suite = "arc-style"
suite = "arc-style"
category = "rule-inference"
difficulty = "hard"
tags = ["arc", "few-shot"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
id = "arc-rainbow-row"
backend = "tabletop"
seed = 0
max_steps = 1400
camera = "front"
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "arc-rainbow-row"
title = "Rule inference: ordering"
grid = {rows = 3, cols = 4, cell = 0.08, origin = [-0.12, 0.08]}
objects = [{name = "block_1", kind = "box", color = "blue", cell = [0, 0], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "block_2", kind = "box", color = "green", cell = [1, 1], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "block_3", kind = "box", color = "red", cell = [0, 3], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "block_4", kind = "box", color = "orange", cell = [1, 2], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}]
fixtures = []
goals = [{type = "grid", expected = [{color = "red", cell = [2, 0]}, {color = "orange", cell = [2, 1]}, {color = "green", cell = [2, 2]}, {color = "blue", cell = [2, 3]}]}]
max_steps = 1400
public = {examples = [{before = [{color = "blue", cell = [0, 1]}, {color = "red", cell = [1, 3]}, {color = "yellow", cell = [0, 2]}], after = [{color = "red", cell = [2, 0]}, {color = "yellow", cell = [2, 1]}, {color = "blue", cell = [2, 2]}]}, {before = [{color = "green", cell = [1, 0]}, {color = "orange", cell = [0, 3]}], after = [{color = "orange", cell = [2, 0]}, {color = "green", cell = [2, 1]}]}, {before = [{color = "blue", cell = [2, 3]}, {color = "yellow", cell = [0, 0]}, {color = "red", cell = [1, 1]}, {color = "green", cell = [2, 0]}], after = [{color = "red", cell = [2, 0]}, {color = "yellow", cell = [2, 1]}, {color = "green", cell = [2, 2]}, {color = "blue", cell = [2, 3]}]}]}
