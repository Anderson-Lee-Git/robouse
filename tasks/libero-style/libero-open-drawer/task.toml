version = "1.0"

[task]
name = "robouse/libero-open-drawer"
description = "Open the drawer"

[metadata]
source_benchmark = "LIBERO (Liu et al. 2023), adapted"
source_task = "open the middle drawer of the cabinet"
source_suite = "libero_goal"
suite = "libero-style"
category = "articulated"
difficulty = "medium"
tags = ["libero", "drawer"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
id = "libero-open-drawer"
backend = "tabletop"
seed = 0
max_steps = 400
camera = "front"
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "libero-open-drawer"
title = "Open the drawer"
goal = "Open the drawer of the cabinet by pulling its handle, at least 8 cm."
objects = [{name = "red_block", kind = "box", color = "red", pos = [-0.15, -0.05], size = [0.02, 0.02, 0.02]}]
fixtures = [{name = "drawer", kind = "drawer", pos = [0.15, 0.17], color = "darkgrey", open = 0.0}]
goals = [{type = "drawer", drawer = "drawer", min_open = 0.08}]
max_steps = 400
