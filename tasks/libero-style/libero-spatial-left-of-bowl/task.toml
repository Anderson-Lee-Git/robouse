version = "1.0"

[task]
name = "robouse/libero-spatial-left-of-bowl"
description = "Move the red block that is left of the bowl"

[metadata]
source_benchmark = "LIBERO (Liu et al. 2023), adapted"
source_task = "pick up the black bowl next to the ramekin and place it on the plate"
source_suite = "libero_spatial"
suite = "libero-style"
category = "pick-place"
difficulty = "easy"
tags = ["libero", "spatial", "referring-expression"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
id = "libero-spatial-left-of-bowl"
backend = "tabletop"
seed = 0
max_steps = 500
camera = "front"
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "libero-spatial-left-of-bowl"
title = "Move the red block that is left of the bowl"
goal = "There are two identical red blocks. Pick up the red block that is to the LEFT of the bowl and place it on the plate. Do not move the other red block."
objects = [{name = "red_block_a", kind = "box", color = "red", pos = [0.14, 0.12], size = [0.02, 0.02, 0.02]}, {name = "red_block_b", kind = "box", color = "red", pos = [-0.14, 0.12], size = [0.02, 0.02, 0.02]}]
fixtures = [{name = "bowl", kind = "bowl", pos = [0.0, 0.12], radius = 0.06, color = "white"}, {name = "plate", kind = "plate", pos = [0.0, -0.1], color = "white"}]
goals = [{type = "on_plate", obj = "red_block_b", plate = "plate"}, {type = "unmoved", obj = "red_block_a"}]
max_steps = 500
