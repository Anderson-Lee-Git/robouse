version = "1.0"

[task]
name = "robouse/libero-spatial-between-vision"
description = "Move the blue block between the cylinder and the tray"

[metadata]
source_benchmark = "LIBERO (Liu et al. 2023), adapted"
source_task = "pick up the black bowl between the plate and the ramekin and place it on the plate"
source_suite = "libero_spatial"
suite = "vision"
base_suite = "libero-style"
base_task = "libero-spatial-between"
category = "pick-place"
difficulty = "easy"
tags = ["libero", "spatial", "referring-expression"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
obs_mode = "vision"
cameras = ["front", "top"]
visible_fields = ["hand_pos", "gripper_open", "holding", "examples", "grid", "constraint_violations"]
camera = "front"
id = "libero-spatial-between-vision"
backend = "tabletop"
seed = 0
max_steps = 500
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "libero-spatial-between"
title = "Move the blue block between the cylinder and the tray"
goal = "There are two identical blue blocks. Pick up the blue block that is BETWEEN the yellow cylinder and the tray and place it on the plate. Do not move the other blue block."
objects = [{name = "yellow_cylinder", kind = "cyl", color = "yellow", pos = [-0.2, 0.1], size = [0.02, 0.035]}, {name = "blue_block_a", kind = "box", color = "blue", pos = [-0.03, 0.1], size = [0.02, 0.02, 0.02]}, {name = "blue_block_b", kind = "box", color = "blue", pos = [-0.12, -0.12], size = [0.02, 0.02, 0.02]}]
fixtures = [{name = "tray", kind = "tray", pos = [0.16, 0.1], size = [0.06, 0.06], color = "white"}, {name = "plate", kind = "plate", pos = [0.1, -0.1], color = "white"}]
goals = [{type = "on_plate", obj = "blue_block_a", plate = "plate"}, {type = "unmoved", obj = "blue_block_b"}]
max_steps = 500
