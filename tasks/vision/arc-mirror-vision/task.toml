version = "1.0"

[task]
name = "robouse/arc-mirror-vision"
description = "Rule inference: completing a pattern"

[metadata]
source_benchmark = "ARC-AGI (style), robouse original"
source_task = "mirror"
source_suite = "arc-style"
suite = "vision"
base_suite = "arc-style"
base_task = "arc-mirror"
category = "rule-inference"
difficulty = "medium"
tags = ["arc", "few-shot", "supply"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
obs_mode = "vision"
cameras = ["front", "top"]
visible_fields = ["hand_pos", "gripper_open", "holding", "examples", "grid", "constraint_violations"]
camera = "front"
id = "arc-mirror-vision"
backend = "tabletop"
seed = 0
max_steps = 1200
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "arc-mirror"
title = "Rule inference: completing a pattern"
grid = {rows = 3, cols = 4, cell = 0.08, origin = [-0.12, 0.08]}
objects = [{name = "block_1", kind = "box", color = "red", cell = [2, 0], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "block_2", kind = "box", color = "green", cell = [0, 1], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "block_3", kind = "box", color = "blue", cell = [1, 0], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "supply_1", kind = "box", color = "green", pos = [-0.18, -0.2], size = [0.02, 0.02, 0.02]}, {name = "supply_2", kind = "box", color = "yellow", pos = [-0.06, -0.2], size = [0.02, 0.02, 0.02]}, {name = "supply_3", kind = "box", color = "red", pos = [0.06, -0.2], size = [0.02, 0.02, 0.02]}, {name = "supply_4", kind = "box", color = "blue", pos = [0.18, -0.2], size = [0.02, 0.02, 0.02]}]
fixtures = []
goals = [{type = "grid", expected = [{color = "red", cell = [2, 0]}, {color = "green", cell = [0, 1]}, {color = "blue", cell = [1, 0]}, {color = "red", cell = [2, 3]}, {color = "green", cell = [0, 2]}, {color = "blue", cell = [1, 3]}]}]
max_steps = 1200
public = {examples = [{before = [{color = "red", cell = [0, 0]}, {color = "blue", cell = [1, 1]}], supply_before = ["red", "blue", "green"], after = [{color = "red", cell = [0, 0]}, {color = "blue", cell = [1, 1]}, {color = "red", cell = [0, 3]}, {color = "blue", cell = [1, 2]}], supply_after = ["green"]}, {before = [{color = "green", cell = [2, 1]}, {color = "yellow", cell = [0, 1]}, {color = "green", cell = [1, 0]}], supply_before = ["green", "green", "yellow", "red"], after = [{color = "green", cell = [2, 1]}, {color = "yellow", cell = [0, 1]}, {color = "green", cell = [1, 0]}, {color = "green", cell = [2, 2]}, {color = "yellow", cell = [0, 2]}, {color = "green", cell = [1, 3]}], supply_after = ["red"]}]}
