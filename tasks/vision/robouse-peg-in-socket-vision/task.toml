version = "1.0"

[task]
name = "robouse/robouse-peg-in-socket-vision"
description = "Insert a peg into a socket"

[metadata]
source_benchmark = "BenchFlow robo-use (task family, adapted to a single floating gripper)"
source_task = "D03 Gentle Insertion"
source_suite = "robo-use D-family"
suite = "vision"
base_suite = "robo-use-families"
base_task = "robouse-peg-in-socket"
category = "insertion"
difficulty = "medium"
tags = ["robo-use", "insertion"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
obs_mode = "vision"
cameras = ["front", "top"]
visible_fields = ["hand_pos", "gripper_open", "holding", "examples", "grid", "constraint_violations"]
camera = "front"
id = "robouse-peg-in-socket-vision"
backend = "tabletop"
seed = 0
max_steps = 600
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "robouse-peg-in-socket"
title = "Insert a peg into a socket"
goal = "Pick up the orange peg and insert it upright into the dark square socket so that it stands on the table inside the socket (centre within 8 mm of the socket centre, tilt under 5 degrees). The socket is 4.4 cm wide inside; the peg is 3.2 cm in diameter and 8 cm tall."
objects = [{name = "peg", kind = "cyl", color = "orange", pos = [-0.12, -0.05], size = [0.016, 0.04]}]
fixtures = [{name = "socket", kind = "socket", pos = [0.12, 0.06], inner = 0.022, height = 0.035, color = "darkgrey"}]
goals = [{type = "in_socket", obj = "peg", socket = "socket", xy_tol = 0.008, max_bottom = 0.008, max_tilt = 5}]
max_steps = 600
