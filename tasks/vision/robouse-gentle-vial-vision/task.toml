version = "1.0"

[task]
name = "robouse/robouse-gentle-vial-vision"
description = "Gentle placement of a fragile vial"

[metadata]
source_benchmark = "BenchFlow robo-use (task family, adapted to a single floating gripper)"
source_task = "D03 Gentle Insertion (force/impact-limited handling)"
source_suite = "robo-use D-family"
suite = "vision"
base_suite = "robo-use-families"
base_task = "robouse-gentle-vial"
category = "gentle"
difficulty = "medium"
tags = ["robo-use", "fragile", "speed-limit"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
obs_mode = "vision"
cameras = ["front", "top"]
visible_fields = ["hand_pos", "gripper_open", "holding", "examples", "grid", "constraint_violations"]
camera = "front"
id = "robouse-gentle-vial-vision"
backend = "tabletop"
seed = 0
max_steps = 700
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "robouse-gentle-vial"
title = "Gentle placement of a fragile vial"
goal = "Move the fragile white vial onto the blue pad and leave it standing upright (tilt under 10 degrees). The vial must never move downward faster than 0.2 m/s (about 0.4 cm per step), which the server measures at every step; dropping it even from a few millimetres breaks this limit. Violations are reported in `constraint_violations`."
objects = [{name = "vial", kind = "cyl", color = "white", pos = [-0.12, -0.05], size = [0.015, 0.03]}]
fixtures = [{name = "blue_pad", kind = "pad", pos = [0.12, 0.08], size = [0.035, 0.035], color = "blue"}]
constraints = [{type = "max_down_speed", object = "vial", limit = 0.2}]
goals = [{type = "on_pad", obj = "vial", pad = "blue_pad", max_tilt = 10}]
max_steps = 700
