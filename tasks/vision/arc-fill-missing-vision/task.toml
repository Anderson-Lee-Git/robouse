version = "1.0"

[task]
name = "robouse/arc-fill-missing-vision"
description = "Rule inference: the missing piece"

[metadata]
source_benchmark = "ARC-AGI (style), robouse original"
source_task = "fill-missing"
source_suite = "arc-style"
suite = "vision"
base_suite = "arc-style"
base_task = "arc-fill-missing"
category = "rule-inference"
difficulty = "easy"
tags = ["arc", "few-shot", "supply"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
obs_mode = "vision"
cameras = ["front", "top"]
visible_fields = ["hand_pos", "gripper_open", "holding", "examples", "grid", "constraint_violations"]
camera = "front"
id = "arc-fill-missing-vision"
backend = "tabletop"
seed = 0
max_steps = 600
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "arc-fill-missing"
title = "Rule inference: the missing piece"
grid = {rows = 2, cols = 3, cell = 0.08, origin = [-0.08, 0.06]}
objects = [{name = "block_1", kind = "box", color = "green", cell = [0, 0], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "block_2", kind = "box", color = "red", cell = [0, 1], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "block_3", kind = "box", color = "blue", cell = [0, 2], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "block_4", kind = "box", color = "green", cell = [1, 0], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "block_5", kind = "box", color = "red", cell = [1, 1], pos = [0.0, 0.0], size = [0.02, 0.02, 0.02]}, {name = "supply_1", kind = "box", color = "yellow", pos = [-0.1, -0.16], size = [0.02, 0.02, 0.02]}, {name = "supply_2", kind = "box", color = "blue", pos = [0.1, -0.16], size = [0.02, 0.02, 0.02]}]
fixtures = []
goals = [{type = "grid", expected = [{color = "green", cell = [0, 0]}, {color = "red", cell = [0, 1]}, {color = "blue", cell = [0, 2]}, {color = "green", cell = [1, 0]}, {color = "red", cell = [1, 1]}, {color = "blue", cell = [1, 2]}]}]
max_steps = 600
public = {examples = [{before = [{color = "red", cell = [0, 0]}, {color = "blue", cell = [0, 1]}, {color = "green", cell = [0, 2]}, {color = "red", cell = [1, 0]}, {color = "green", cell = [1, 2]}], supply_before = ["blue", "yellow"], after = [{color = "red", cell = [0, 0]}, {color = "blue", cell = [0, 1]}, {color = "green", cell = [0, 2]}, {color = "red", cell = [1, 0]}, {color = "blue", cell = [1, 1]}, {color = "green", cell = [1, 2]}], supply_after = ["yellow"]}, {before = [{color = "yellow", cell = [0, 0]}, {color = "yellow", cell = [0, 1]}, {color = "red", cell = [0, 2]}, {color = "yellow", cell = [1, 1]}, {color = "red", cell = [1, 2]}], supply_before = ["green", "yellow"], after = [{color = "yellow", cell = [0, 0]}, {color = "yellow", cell = [0, 1]}, {color = "red", cell = [0, 2]}, {color = "yellow", cell = [1, 0]}, {color = "yellow", cell = [1, 1]}, {color = "red", cell = [1, 2]}], supply_after = ["green"]}]}
