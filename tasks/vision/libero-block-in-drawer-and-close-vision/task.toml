version = "1.0"

[task]
name = "robouse/libero-block-in-drawer-and-close-vision"
description = "Put the block in the drawer and close it"

[metadata]
source_benchmark = "LIBERO (Liu et al. 2023), adapted"
source_task = "put the black bowl in the bottom drawer of the cabinet and close it"
source_suite = "libero_10"
suite = "vision"
base_suite = "libero-style"
base_task = "libero-block-in-drawer-and-close"
category = "articulated"
difficulty = "hard"
tags = ["libero", "drawer", "long-horizon"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
obs_mode = "vision"
cameras = ["front", "top"]
visible_fields = ["hand_pos", "gripper_open", "holding", "examples", "grid", "constraint_violations"]
camera = "front"
id = "libero-block-in-drawer-and-close-vision"
backend = "tabletop"
seed = 0
max_steps = 900
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "libero-block-in-drawer-and-close"
title = "Put the block in the drawer and close it"
goal = "Put the blue block in the open drawer, then close the drawer (within 1 cm)."
objects = [{name = "blue_block", kind = "box", color = "blue", pos = [-0.14, -0.04], size = [0.02, 0.02, 0.02]}]
fixtures = [{name = "drawer", kind = "drawer", pos = [0.15, 0.17], color = "darkgrey", open = 0.12}]
goals = [{type = "in", obj = "blue_block", container = "drawer"}, {type = "drawer", drawer = "drawer", max_open = 0.01}]
max_steps = 900
