version = "1.0"

[task]
name = "robouse/robouse-sort-by-colour"
description = "Sort blocks into trays by colour"

[metadata]
source_benchmark = "BenchFlow robo-use (task family, adapted to a single floating gripper)"
source_task = "L-family multi-object sorting"
source_suite = "robo-use L-family"
suite = "robo-use-families"
category = "sorting"
difficulty = "medium"
tags = ["robo-use", "sorting", "multi-object"]

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[robouse]
id = "robouse-sort-by-colour"
backend = "tabletop"
seed = 0
max_steps = 1400
camera = "front"
skills = true
success_mode = "final"  # judged after `robo done` (or `robo give-up`) and a 10-step settle

[robouse.scenario]
id = "robouse-sort-by-colour"
title = "Sort blocks into trays by colour"
goal = "Put both red blocks into the tray on the left (red_tray) and both blue blocks into the tray on the right (blue_tray)."
objects = [{name = "block_1", kind = "box", color = "red", pos = [-0.05, -0.12], size = [0.02, 0.02, 0.02]}, {name = "block_2", kind = "box", color = "red", pos = [0.16, -0.06], size = [0.02, 0.02, 0.02]}, {name = "block_3", kind = "box", color = "blue", pos = [-0.18, -0.07], size = [0.02, 0.02, 0.02]}, {name = "block_4", kind = "box", color = "blue", pos = [0.04, -0.02], size = [0.02, 0.02, 0.02]}]
fixtures = [{name = "red_tray", kind = "tray", pos = [-0.17, 0.14], size = [0.075, 0.06], color = "pink"}, {name = "blue_tray", kind = "tray", pos = [0.17, 0.14], size = [0.075, 0.06], color = "cyan"}]
goals = [{type = "in", obj = "block_1", container = "red_tray"}, {type = "in", obj = "block_2", container = "red_tray"}, {type = "in", obj = "block_3", container = "blue_tray"}, {type = "in", obj = "block_4", container = "blue_tray"}]
max_steps = 1400
