# robouse task topology (merged by BenchFlow over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: robouse episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    image: robouse-sim:__SIM_TAG__
    # BenchFlow removes service images when a trial ends (`compose down --rmi all`), so the service
    # declares its build; repeat builds are served from the Docker build cache.
    build:
      context: ../../../runtime
      dockerfile: Dockerfile.sim
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
    environment:
      # The robouse task definition (task.toml); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_TOML: |
__TASK_TOML__
    command: ["robouse-sim-entry", "--max-wall-s", "__MAX_WALL_S__"__SEED_ARGS__]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
