# Optional local hooks: `pip install pre-commit && pre-commit install`, or the dependency-free
# `git config core.hooksPath .githooks` (auto-fixes ruff lint/format on staged files). CI (.github/workflows/ci.yml) runs the same
# checks on every pull request.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
